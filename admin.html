<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Self CHIMR</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --white: #ffffff;
            --navy: #0f172a;
            --navy-light: #1e293b;
            --slate: #64748b;
            --slate-light: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f8fafc;
            --amber: #f59e0b;
            --amber-bg: #fef3c7;
            --amber-text: #b45309;
            --green: #10b981;
            --green-bg: #d1fae5;
            --green-text: #047857;
            --red: #ef4444;
            --red-bg: #fef2f2;
            --red-border: #fecaca;
            --red-text: #dc2626;
            --blue: #0284c7;
            --blue-bg: #e0f2fe;
            --blue-text: #075985;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--navy); }

        /* ─── ÉCRAN DE CONNEXION ─── */
        #ecran-login {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: var(--white); border-radius: 20px; padding: 36px 28px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1); max-width: 360px; width: 100%; text-align: center;
        }
        .login-icon { font-size: 40px; margin-bottom: 12px; }
        .login-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .login-sub { font-size: 13px; color: var(--slate); margin-bottom: 24px; }
        .login-input {
            width: 100%; padding: 14px 16px; background: var(--bg); border: 1.5px solid var(--border);
            border-radius: var(--radius-md); font-size: 16px; font-weight: 600; color: var(--navy);
            outline: none; margin-bottom: 12px; text-align: center; letter-spacing: 2px;
            transition: border-color 0.15s;
        }
        .login-input:focus { border-color: var(--navy); }
        .btn-login {
            width: 100%; background: var(--navy); color: white; border: none;
            font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            padding: 14px; border-radius: var(--radius-md); cursor: pointer; transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 0.85; }
        .login-erreur { color: var(--red-text); font-size: 13px; font-weight: 600; margin-top: 10px; display: none; }

        /* ─── APP PRINCIPALE ─── */
        #app-admin { display: none; min-height: 100vh; }

        /* ─── HEADER ─── */
        header {
            background: var(--navy); color: white;
            padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
        }
        .h-logo { display: flex; align-items: center; gap: 10px; }
        .h-icon { font-size: 22px; }
        .h-title { font-size: 16px; font-weight: 800; }
        .h-sub { font-size: 11px; color: #94a3b8; font-weight: 600; }
        .btn-deconnexion { background: rgba(255,255,255,0.12); color: white; border: none; font-size: 11px; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; }

        /* ─── LAYOUT ─── */
        .app-body { max-width: 860px; margin: 0 auto; padding: 24px 16px; }

        /* ─── TABS ─── */
        .tabs { display: flex; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 4px; margin-bottom: 24px; gap: 4px; }
        .tabs button { flex: 1; background: none; border: none; padding: 11px 8px; font-size: 13px; font-weight: 700; color: var(--slate); border-radius: var(--radius-md); cursor: pointer; transition: all 0.18s; }
        .tabs button.actif { background: var(--navy); color: white; }
        .hidden { display: none !important; }

        /* ─── SECTION MENUS ─── */
        .semaine-titre { font-size: 13px; font-weight: 700; color: var(--blue-text); background: var(--blue-bg); padding: 10px 14px; border-radius: var(--radius-md); margin-bottom: 18px; text-align: center; }
        .jour-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        @media (max-width: 600px) { .jour-grid { grid-template-columns: 1fr; } }
        .jour-bloc { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
        .jour-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .jour-titre { font-size: 14px; font-weight: 800; color: var(--blue); text-transform: capitalize; }
        .toggle-ferme-wrap { display: flex; align-items: center; gap: 6px; }
        .toggle-ferme-wrap label { font-size: 11px; font-weight: 700; color: var(--slate); cursor: pointer; }
        .toggle-ferme { width: 36px; height: 20px; appearance: none; background: var(--border); border-radius: 10px; cursor: pointer; position: relative; transition: background 0.2s; }
        .toggle-ferme:checked { background: var(--red); }
        .toggle-ferme::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: white; border-radius: 50%; transition: left 0.2s; }
        .toggle-ferme:checked::after { left: 18px; }

        .input-group { margin-bottom: 10px; }
        .input-group:last-child { margin-bottom: 0; }
        .input-label { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; color: var(--slate-light); text-transform: uppercase; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; color: var(--navy); outline: none; transition: border-color 0.15s; background: var(--bg); }
        .input-group input:focus { border-color: var(--navy); background: var(--white); }
        .input-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
        .limite-toggle { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
        .limite-toggle input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; accent-color: var(--navy); }
        .limite-toggle label { font-size: 11px; font-weight: 600; color: var(--slate); cursor: pointer; }
        .limite-input { width: 72px !important; text-align: center; font-weight: 700 !important; }
        .limite-input:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-publier { width: 100%; background: var(--navy); color: white; border: none; font-size: 14px; font-weight: 700; text-transform: uppercase; padding: 15px; border-radius: var(--radius-lg); cursor: pointer; margin-top: 6px; transition: opacity 0.2s; }
        .btn-publier:hover { opacity: 0.88; }
        .toast { background: var(--green); color: white; text-align: center; font-size: 13px; font-weight: 700; padding: 12px; border-radius: var(--radius-md); margin-top: 12px; display: none; }

        /* ─── SECTION REGISTRE ─── */
        .registre-top { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
        .select-jour { flex: 1; min-width: 200px; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 14px; font-weight: 600; color: var(--navy); background: var(--white); outline: none; cursor: pointer; }
        .btn-actualiser { background: var(--blue-bg); color: var(--blue-text); border: 1px solid #bae6fd; font-size: 12px; font-weight: 700; padding: 11px 16px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; }
        .btn-csv { background: var(--green-bg); color: var(--green-text); border: 1px solid #a7f3d0; font-size: 12px; font-weight: 700; padding: 11px 16px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        @media (max-width: 500px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        .stat-card { background: var(--white); border: 1px solid var(--border); padding: 14px 12px; border-radius: var(--radius-lg); text-align: center; }
        .stat-val { font-size: 26px; font-weight: 800; color: var(--navy); }
        .stat-lbl { font-size: 10px; color: var(--slate); font-weight: 700; margin-top: 2px; text-transform: uppercase; }
        .stat-card.a .stat-val { color: var(--amber-text); }
        .stat-card.b .stat-val { color: var(--green-text); }

        /* Tableaux */
        .tableaux-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 600px) { .tableaux-grid { grid-template-columns: 1fr; } }
        .bloc-tableau { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
        .titre-tableau { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--navy); display: flex; justify-content: space-between; align-items: center; }
        .sous-total { font-size: 11px; color: var(--slate); font-weight: 700; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--border-light); font-weight: 700; color: var(--slate); font-size: 11px; text-transform: uppercase; }
        .no-data { text-align: center; padding: 20px; color: var(--slate-light); font-style: italic; font-size: 13px; }
        .row-menu-a td { background: rgba(254,243,199,0.5); color: var(--amber-text); font-weight: 800; font-size: 11px; text-transform: uppercase; }
        .row-menu-b td { background: rgba(209,250,229,0.5); color: var(--green-text); font-weight: 800; font-size: 11px; text-transform: uppercase; }
        .chk { font-size: 14px; cursor: pointer; }
        .heure-badge { font-size: 11px; font-weight: 700; color: var(--slate); background: var(--bg); padding: 2px 8px; border-radius: 20px; }

        /* Actions bas */
        .actions-bas { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .btn-imprimer { flex: 1; background: var(--blue); color: white; border: none; font-size: 13px; font-weight: 700; text-transform: uppercase; padding: 13px; border-radius: var(--radius-md); cursor: pointer; }

        /* Indicateur chargement */
        .chargement-inline { text-align: center; padding: 30px; color: var(--slate); font-weight: 600; }

        /* ─── IMPRESSION ─── */
        @media print {
            #ecran-login, header, .tabs, .registre-top, .actions-bas, .stat-card, .stats-grid { display: none !important; }
            body { background: white; }
            .app-body { padding: 0; max-width: none; }
            #section-registre::before {
                content: "LISTE DES INSCRITS – " attr(data-date-print);
                display: block; font-size: 15px; font-weight: 800; margin-bottom: 14px;
                border-bottom: 2px solid #000; padding-bottom: 6px;
            }
            .tableaux-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .bloc-tableau { border: 1px solid #ccc; padding: 10px; }
            table { font-size: 10px; }
            th, td { padding: 4px 6px; }
            .chk { display: none; }
        }
    </style>
</head>
<body>

<!-- ══════ ÉCRAN DE CONNEXION ══════ -->
<div id="ecran-login">
    <div class="login-card">
        <div class="login-icon">🔐</div>
        <div class="login-title">Espace Administration</div>
        <div class="login-sub">Self CHIMR · Accès réservé</div>
        <input type="password" id="login-pwd" class="login-input" placeholder="Mot de passe" onkeydown="if(event.key==='Enter') seConnecter()">
        <button class="btn-login" onclick="seConnecter()">Accéder au tableau de bord</button>
        <div class="login-erreur" id="login-erreur">⚠️ Mot de passe incorrect.</div>
    </div>
</div>

<!-- ══════ APP ADMIN ══════ -->
<div id="app-admin">

    <header>
        <div class="h-logo">
            <span class="h-icon">🍳</span>
            <div>
                <div class="h-title">Administration · Self CHIMR</div>
                <div class="h-sub">Gestion des menus et des inscriptions</div>
            </div>
        </div>
        <button class="btn-deconnexion" onclick="seDeconnecter()">🔓 Déconnexion</button>
    </header>

    <div class="app-body">
        <div class="tabs">
            <button id="tab-registre" class="actif" onclick="basculerOnglet('registre')">📊 Liste cuisine</button>
            <button id="tab-actuelle" onclick="basculerOnglet('actuelle')">📅 Semaine en cours</button>
            <button id="tab-suivante" onclick="basculerOnglet('suivante')">⏩ Semaine suivante</button>
        </div>

        <!-- ══════ SECTION MENUS ══════ -->
        <div id="section-menus" class="hidden">
            <div id="semaine-titre" class="semaine-titre">Chargement…</div>
            <form id="form-admin">
                <div class="jour-grid" id="conteneur-jours"></div>
                <button type="submit" class="btn-publier">🚀 Publier les menus</button>
                <div class="toast" id="toast-pub">✅ Menus publiés avec succès !</div>
            </form>
        </div>

        <!-- ══════ SECTION REGISTRE ══════ -->
        <div id="section-registre">
            <div class="registre-top">
                <select class="select-jour" id="select-jour" onchange="chargerJour()"></select>
                <button class="btn-actualiser" onclick="chargerJour()">🔄 Actualiser</button>
                <button class="btn-csv" onclick="exporterCSV()">⬇️ Export CSV</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><div id="total-total" class="stat-val">—</div><div class="stat-lbl">Total repas</div></div>
                <div class="stat-card a"><div id="total-a" class="stat-val">—</div><div class="stat-lbl">🍖 Menu A</div></div>
                <div class="stat-card b"><div id="total-b" class="stat-val">—</div><div class="stat-lbl">🌿 Menu B</div></div>
                <div class="stat-card"><div id="total-emporter" class="stat-val">—</div><div class="stat-lbl">🛍️ À emporter</div></div>
            </div>

            <div id="zone-registre"><div class="chargement-inline">🔄 Chargement…</div></div>

            <div class="actions-bas">
                <button class="btn-imprimer" onclick="window.print()">🖨️ Imprimer le registre</button>
            </div>
        </div>

    </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbzcCFLxV_IxqN6zToLlGcCysRZKlbZWFYv2vla3vx8nSV2-BTzdubh9GLmIJ9XMVhjD/exec";

// ⚠️  CHANGEZ CE MOT DE PASSE avant de mettre en production
const MOT_DE_PASSE_ADMIN = "chimr2025";

const JOURS_NOM  = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const MOIS_LONG  = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

let semaineSelectionnee  = "actuelle";
let menusServeurComplets = {};
let commandesDuJour      = [];
let jourAffiché          = "";

// ─── AUTHENTIFICATION ─────────────────────────────────────────────────────────
function seConnecter() {
    const saisie = document.getElementById('login-pwd').value;
    if (saisie === MOT_DE_PASSE_ADMIN) {
        sessionStorage.setItem('admin_auth', '1');
        document.getElementById('ecran-login').style.display = 'none';
        document.getElementById('app-admin').style.display   = 'block';
        initialiserAdmin();
    } else {
        const el = document.getElementById('login-erreur');
        el.style.display = 'block';
        document.getElementById('login-pwd').value = '';
        setTimeout(() => { el.style.display = 'none'; }, 3000);
    }
}

function seDeconnecter() {
    sessionStorage.removeItem('admin_auth');
    document.getElementById('app-admin').style.display   = 'none';
    document.getElementById('ecran-login').style.display = 'flex';
    document.getElementById('login-pwd').value = '';
}

window.addEventListener('DOMContentLoaded', () => {
    if (sessionStorage.getItem('admin_auth') === '1') {
        document.getElementById('ecran-login').style.display = 'none';
        document.getElementById('app-admin').style.display   = 'block';
        initialiserAdmin();
    }
    document.getElementById('login-pwd').addEventListener('keydown', e => {
        if (e.key === 'Enter') seConnecter();
    });
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
function initialiserAdmin() {
    fetch(`${URL_SCRIPT_GOOGLE}?action=obtenirMenus`)
        .then(r => r.json())
        .then(data => { menusServeurComplets = data; })
        .catch(() => {});

    // Remplir le sélecteur de jour (registre)
    const select   = document.getElementById('select-jour');
    const maintenant = new Date();
    for (let i = -7; i < 30; i++) {
        const d = new Date(maintenant.getFullYear(), maintenant.getMonth(), maintenant.getDate() + i);
        if (d.getDay() === 0 || d.getDay() === 6) continue;
        const opt = document.createElement('option');
        opt.value = dateLocal(d);
        opt.textContent = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
        if (i === 0) opt.selected = true;
        select.appendChild(opt);
    }
    chargerJour();
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function dateLocal(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function baseLundi(choix) {
    const auj = new Date();
    let dow = auj.getDay(); if (dow === 0) dow = 7;
    const lundi = new Date(auj.getFullYear(), auj.getMonth(), auj.getDate() - (dow-1));
    if (choix === "suivante") lundi.setDate(lundi.getDate() + 7);
    return lundi;
}

// ─── ONGLETS ──────────────────────────────────────────────────────────────────
function basculerOnglet(onglet) {
    ['registre','actuelle','suivante'].forEach(o => {
        document.getElementById('tab-'+o).classList.toggle('actif', o === onglet);
    });
    document.getElementById('section-menus').classList.toggle('hidden', onglet === 'registre');
    document.getElementById('section-registre').classList.toggle('hidden', onglet !== 'registre');
    if (onglet === 'registre') { chargerJour(); }
    else {
        semaineSelectionnee = onglet;
        genererInterfaceMenus();
    }
}

// ─── INTERFACE MENUS ──────────────────────────────────────────────────────────
function genererInterfaceMenus() {
    const lundi     = baseLundi(semaineSelectionnee);
    const conteneur = document.getElementById('conteneur-jours');
    document.getElementById('semaine-titre').textContent =
        `Semaine du lundi ${lundi.getDate()} ${MOIS_LONG[lundi.getMonth()]} ${lundi.getFullYear()}`;
    conteneur.innerHTML = "";

    for (let i = 0; i < 5; i++) {
        const d    = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + i, 12);
        const cle  = dateLocal(d);
        const menu = menusServeurComplets[cle] || {};
        const ferme = menu.ferme === true || menu.ferme === 'true';

        const bloc = document.createElement('div');
        bloc.className = 'jour-bloc';
        bloc.innerHTML = `
            <div class="jour-header">
                <div class="jour-titre" data-date="${cle}">
                    📅 ${d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}
                </div>
                <div class="toggle-ferme-wrap">
                    <input type="checkbox" class="toggle-ferme" id="ferme-${cle}" ${ferme ? 'checked' : ''} onchange="toggleFerme('${cle}')">
                    <label for="ferme-${cle}">Fermé</label>
                </div>
            </div>

            <div id="champs-${cle}" ${ferme ? 'style="opacity:.35;pointer-events:none;"' : ''}>
                <div class="input-group">
                    <div class="input-label"><span style="color:#b45309;">🍖</span> Menu A – Intitulé du plat</div>
                    <input type="text" id="a-${cle}" value="${menu.A||''}" placeholder="Ex : Poulet rôti aux herbes">
                </div>
                <div class="input-group">
                    <div class="limite-toggle">
                        <input type="checkbox" id="chk-limA-${cle}" ${menu.limiteA != null ? 'checked' : ''} onchange="toggleLimite('A','${cle}')">
                        <label for="chk-limA-${cle}" style="font-size:10px;font-weight:700;color:var(--slate-light);text-transform:uppercase;">Limiter le Menu A</label>
                    </div>
                    <input type="number" id="limA-${cle}" class="limite-input" min="1" max="999"
                        value="${menu.limiteA != null ? menu.limiteA : ''}"
                        placeholder="nb max"
                        ${menu.limiteA != null ? '' : 'disabled'}
                        style="width:80px;">
                </div>

                <div class="input-group" style="margin-top:10px;">
                    <div class="input-label"><span style="color:#047857;">🌿</span> Menu B – Intitulé du plat</div>
                    <input type="text" id="b-${cle}" value="${menu.B||''}" placeholder="Ex : Gratin de légumes">
                </div>
                <div class="input-group">
                    <div class="limite-toggle">
                        <input type="checkbox" id="chk-limB-${cle}" ${menu.limiteB != null ? 'checked' : ''} onchange="toggleLimite('B','${cle}')">
                        <label for="chk-limB-${cle}" style="font-size:10px;font-weight:700;color:var(--slate-light);text-transform:uppercase;">Limiter le Menu B</label>
                    </div>
                    <input type="number" id="limB-${cle}" class="limite-input" min="1" max="999"
                        value="${menu.limiteB != null ? menu.limiteB : ''}"
                        placeholder="nb max"
                        ${menu.limiteB != null ? '' : 'disabled'}
                        style="width:80px;">
                </div>
            </div>
        `;
        conteneur.appendChild(bloc);
    }
}

function toggleFerme(cle) {
    const checked = document.getElementById('ferme-'+cle).checked;
    const champs  = document.getElementById('champs-'+cle);
    champs.style.opacity        = checked ? '0.35' : '';
    champs.style.pointerEvents  = checked ? 'none' : '';
}

function toggleLimite(lettre, cle) {
    const checked = document.getElementById(`chk-lim${lettre}-${cle}`).checked;
    const input   = document.getElementById(`lim${lettre}-${cle}`);
    input.disabled = !checked;
    if (!checked) input.value = '';
    else { input.focus(); input.value = input.value || ''; }
}

document.getElementById('form-admin').addEventListener('submit', function(e) {
    e.preventDefault();
    const paquets = [];
    document.querySelectorAll('.jour-bloc').forEach(bloc => {
        const cle    = bloc.querySelector('[data-date]').getAttribute('data-date');
        const ferme  = document.getElementById('ferme-'+cle).checked;
        const chkA   = document.getElementById('chk-limA-'+cle)?.checked;
        const chkB   = document.getElementById('chk-limB-'+cle)?.checked;
        const valLimA = document.getElementById('limA-'+cle)?.value;
        const valLimB = document.getElementById('limB-'+cle)?.value;
        paquets.push({
            date:   cle,
            menuA:  ferme ? '' : (document.getElementById('a-'+cle)?.value || ''),
            menuB:  ferme ? '' : (document.getElementById('b-'+cle)?.value || ''),
            ferme:  ferme,
            limiteA: (chkA && valLimA) ? parseInt(valLimA) : null,
            limiteB: (chkB && valLimB) ? parseInt(valLimB) : null,
        });
    });
    const toast = document.getElementById('toast-pub');
    fetch(URL_SCRIPT_GOOGLE, {
        method: "POST", mode: "no-cors",
        body: new URLSearchParams({ action: "enregistrerMenus", donnees: JSON.stringify(paquets) })
    }).then(() => {
        // Mettre à jour le cache local
        paquets.forEach(p => {
            menusServeurComplets[p.date] = { A: p.menuA, B: p.menuB, ferme: p.ferme, limiteA: p.limiteA, limiteB: p.limiteB };
        });
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }).catch(() => alert('Erreur réseau lors de la publication.'));
});

// ─── REGISTRE ─────────────────────────────────────────────────────────────────
function chargerJour() {
    const select = document.getElementById('select-jour');
    jourAffiché  = select.value;
    const label  = select.options[select.selectedIndex]?.text || jourAffiché;
    document.getElementById('section-registre').setAttribute('data-date-print', label.toUpperCase());
    document.getElementById('zone-registre').innerHTML = '<div class="chargement-inline">🔄 Chargement…</div>';
    ['total-total','total-a','total-b','total-emporter'].forEach(id => document.getElementById(id).textContent = '—');

    fetch(`${URL_SCRIPT_GOOGLE}?action=obtenirInscriptions`)
    .then(r => r.json())
    .then(data => {
        // Dédoublonner par nom (dernière inscription gagne)
        const map = new Map();
        data.filter(c => {
            const d = (c.date||'').toString().replace(/'/g,'').trim();
            return d === jourAffiché;
        }).forEach(c => map.set((c.nom||'').trim().toLowerCase(), c));

        commandesDuJour = Array.from(map.values());
        // Trier par heure de retrait puis nom
        commandesDuJour.sort((a,b) => {
            const ha = a.heure||'';
            const hb = b.heure||'';
            if (ha !== hb) return ha.localeCompare(hb);
            return (a.nom||'').localeCompare(b.nom||'');
        });
        afficherRegistre();
    })
    .catch(() => {
        document.getElementById('zone-registre').innerHTML = '<div class="chargement-inline">⚠️ Erreur de chargement. Vérifiez la connexion.</div>';
    });
}

function afficherRegistre() {
    const place    = commandesDuJour.filter(c => c.mode === 'Sur place');
    const emporter = commandesDuJour.filter(c => c.mode === 'À emporter');
    const totalA   = commandesDuJour.filter(c => c.menu === 'Menu A').length;
    const totalB   = commandesDuJour.filter(c => c.menu === 'Menu B').length;

    document.getElementById('total-total').textContent    = commandesDuJour.length;
    document.getElementById('total-a').textContent        = totalA;
    document.getElementById('total-b').textContent        = totalB;
    document.getElementById('total-emporter').textContent = emporter.length;

    document.getElementById('zone-registre').innerHTML = `
        <div class="tableaux-grid" id="zone-tableaux">
            <div class="bloc-tableau">
                <div class="titre-tableau">
                    <span>🍽️ Sur place</span>
                    <span class="sous-total">${place.length} repas</span>
                </div>
                ${construireTableauHTML(place)}
            </div>
            <div class="bloc-tableau">
                <div class="titre-tableau">
                    <span>🛍️ À emporter</span>
                    <span class="sous-total">${emporter.length} repas</span>
                </div>
                ${construireTableauHTML(emporter)}
            </div>
        </div>
    `;
}

function construireTableauHTML(liste) {
    if (liste.length === 0) return '<div class="no-data">Aucune commande.</div>';
    let html = '<table><thead><tr><th>✓</th><th>Nom</th><th>Menu</th><th>Heure</th></tr></thead><tbody>';

    ['Menu A','Menu B'].forEach(m => {
        const items = liste.filter(c => c.menu === m);
        if (!items.length) return;
        const cls = m === 'Menu A' ? 'row-menu-a' : 'row-menu-b';
        const ico = m === 'Menu A' ? '🍖' : '🌿';
        html += `<tr class="${cls}"><td colspan="4">${ico} ${m} · ${items.length} repas</td></tr>`;
        items.forEach(cmd => {
            html += `<tr>
                <td><span class="chk">⬜</span></td>
                <td><strong>${cmd.nom||'—'}</strong></td>
                <td style="font-size:11px;color:var(--slate);">${m.replace('Menu ','')}</td>
                <td><span class="heure-badge">${cmd.heure||'—'}</span></td>
            </tr>`;
        });
    });
    return html + '</tbody></table>';
}

// ─── EXPORT CSV ───────────────────────────────────────────────────────────────
function exporterCSV() {
    if (!commandesDuJour.length) { alert('Aucune donnée à exporter.'); return; }
    const select = document.getElementById('select-jour');
    const label  = select.options[select.selectedIndex]?.text || jourAffiché;
    const lignes = [
        ['Date','Nom','Menu','Mode','Heure retrait'],
        ...commandesDuJour.map(c => [
            jourAffiché,
            c.nom||'',
            c.menu||'',
            c.mode||'',
            c.heure||''
        ])
    ];
    const bom  = '\uFEFF';
    const csv  = bom + lignes.map(l => l.map(v => `"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `self-chimr-${jourAffiché}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}
