<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin • Gestion du Self CHIMR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; padding: 20px; }
        main { max-width: 800px; margin: 0 auto; background: white; padding: 24px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #64748b; margin-bottom: 20px; }
        
        /* Onglets */
        .segmented { display: flex; background: #e2e8f0; padding: 4px; border-radius: 14px; margin-bottom: 24px; }
        .segmented label { flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: 700; color: #64748b; border-radius: 10px; cursor: pointer; }
        .segmented input:checked + label { background: #0f172a; color: white; }
        .hidden { display: none !important; }

        /* Styles Registre & Tableaux */
        .select-jour-registre { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
        th { background: #f8fafc; text-transform: uppercase; font-size: 11px; }
        
        .btn-imprimer { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }

        /* --- OPTIMISATION IMPRESSION --- */
        @media print {
            body { background: white; padding: 0; }
            main { box-shadow: none; width: 100%; padding: 0; }
            .segmented, .no-print, .btn-imprimer, .select-jour-registre, #section-menus { display: none !important; }
            
            /* Titre d'impression */
            #section-registre::before { content: "LISTE DES INSCRITS : " attr(data-date-print); display: block; font-size: 20px; font-weight: 800; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
            
            /* Compactage des tableaux */
            table { font-size: 11px !important; margin-bottom: 10px; page-break-inside: avoid; }
            td, th { padding: 3px 6px !important; }
            .stat-card { display: none; }
        }
    </style>
</head>
<body>
    <main>
        <h1>🍳 Administration Self CHIMR</h1>
        <p class="subtitle">Gestion des menus et registre des inscrits.</p>
        
        <div class="segmented no-print">
            <input type="radio" id="tab-registre" name="onglet-admin" class="hidden" checked onchange="basculerOnglet('registre')">
            <label for="tab-registre">📊 Liste cuisine</label>
            <input type="radio" id="tab-menus" name="onglet-admin" class="hidden" onchange="basculerOnglet('menus')">
            <label for="tab-menus">📅 Gérer les menus</label>
        </div>

        <div id="section-registre">
            <select id="select-jour" class="select-jour-registre" onchange="chargerInscriptionsDuJour()"></select>
            <div id="zone-tableaux">
                <div class="bloc-tableau">
                    <table id="table-liste">
                        <thead><tr><th>NOM</th><th>MENU</th><th>MODE</th><th>HEURE</th></tr></thead>
                        <tbody id="corps-liste"></tbody>
                    </table>
                </div>
            </div>
            <button class="btn-imprimer" onclick="window.print()">🖨️ Imprimer la liste synthétique</button>
        </div>

        <div id="section-menus" class="hidden">
            <div id="conteneur-jours"></div>
            <button onclick="sauvegarderMenus()" class="btn-imprimer" style="background:#0f172a">🚀 Publier les menus</button>
        </div>
    </main>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzcCFLxV_IxqN6zToLlGcCysRZKlbZWFYv2vla3vx8nSV2-BTzdubh9GLmIJ9XMVhjD/exec";

        function basculerOnglet(type) {
            document.getElementById('section-registre').classList.toggle('hidden', type !== 'registre');
            document.getElementById('section-menus').classList.toggle('hidden', type !== 'menus');
        }

        function chargerInscriptionsDuJour() {
            const jour = document.getElementById('select-jour').value;
            document.getElementById('section-registre').setAttribute('data-date-print', document.getElementById('select-jour').options[document.getElementById('select-jour').selectedIndex].text);
            
            fetch(`${URL_SCRIPT}?action=obtenirInscriptions`)
            .then(res => res.json())
            .then(data => {
                const corps = document.getElementById('corps-liste');
                corps.innerHTML = "";
                const journee = data.filter(c => c.date === jour);
                
                journee.forEach(cmd => {
                    corps.innerHTML += `<tr><td>${cmd.nom}</td><td>${cmd.menu}</td><td>${cmd.mode}</td><td>${cmd.heure}</td></tr>`;
                });
            });
        }

        // Initialisation dates
        const select = document.getElementById('select-jour');
        const aujourdhui = new Date();
        for (let i = 0; i < 30; i++) {
            let d = new Date(aujourdhui.getFullYear(), aujourdhui.getMonth(), aujourdhui.getDate() + i);
            if (d.getDay() !== 0 && d.getDay() !== 6) {
                let opt = document.createElement('option');
                opt.value = `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
                opt.textContent = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
                select.appendChild(opt);
            }
        }
        chargerInscriptionsDuJour();
    </script>
</body>
</html>
