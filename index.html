<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self CHIMR • Inscriptions</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f8fafc; color: #0f172a; padding-bottom: 40px; }
        header { background: white; padding: 16px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .logo-title { font-size: 20px; font-weight: 800; color: #0f172a; }
        main { max-width: 450px; margin: 0 auto; padding: 16px; }
        h2 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 12px; padding-left: 4px; }
        
        .tabs-nav { display: flex; background: #e2e8f0; padding: 4px; border-radius: 14px; margin-bottom: 24px; position: sticky; top: 70px; z-index: 40; }
        .tabs-nav label { flex: 1; text-align: center; padding: 12px; font-size: 13px; font-weight: 700; color: #64748b; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .tabs-nav input:checked + label { background: #0f172a; color: white; }

        .grid-jours { display: flex; justify-content: space-between; gap: 6px; width: 100%; }
        .btn-jour { flex: 1; height: 85px; background: white; border: 1px solid #e2e8f0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; min-width: 0; }
        .btn-jour .j-nom { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
        .btn-jour .j-num { font-size: 20px; font-weight: 800; color: #0f172a; margin-top: 2px; }
        .btn-jour .j-mois { font-size: 9px; font-weight: 600; color: #94a3b8; margin-top: 1px; }
        .btn-jour.actif { background: #0f172a; border-color: #0f172a; }
        .btn-jour.actif .j-nom { color: #cbd5e1; }
        .btn-jour.actif .j-num { color: white; }
        .btn-jour.actif .j-mois { color: #cbd5e1; }
        
        .hidden { display: none !important; }
        .space-form { margin-top: 24px; }
        
        .card-menu { background: white; border: 1px solid #e2e8f0; border-radius: 20px; padding: 18px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .card-menu .content { flex: 1; padding-right: 12px; }
        .type-a { font-size: 10px; font-weight: 800; color: #b45309; background: #fef3c7; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
        .type-b { font-size: 10px; font-weight: 800; color: #047857; background: #d1fae5; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
        .plat-nom { font-size: 15px; font-weight: 700; color: #334155; margin-top: 8px; display: block; }
        
        .card-menu-input:checked + .card-menu.a { border-color: #f59e0b; background: rgba(254,243,199,0.15); }
        .card-menu-input:checked + .card-menu.b { border-color: #10b981; background: rgba(209,250,229,0.15); }
        
        .segmented { display: flex; background: #e2e8f0; padding: 3px; border-radius: 14px; margin-bottom: 20px; }
        .segmented label { flex: 1; text-align: center; padding: 10px; font-size: 13px; font-weight: 700; color: #64748b; border-radius: 11px; cursor: pointer; }
        .segmented input:checked + label { background: white; color: #0f172a; }
        
        .bloc-info { background: white; border: 1px solid #e2e8f0; padding: 16px; border-radius: 20px; margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; color: #334155; }
        
        .btn-submit { width: 100%; background: #0f172a; color: white; border: none; padding: 16px; border-radius: 16px; font-weight: 700; cursor: pointer; }
        
        .res-card { background: white; border: 1px solid #e2e8f0; border-radius: 18px; padding: 16px; margin-bottom: 12px; }
        .res-header { display: flex; justify-content: space-between; border-bottom: 1px dashed #e2e8f0; padding-bottom: 8px; margin-bottom: 8px; }
        .res-date { font-weight: 800; font-size: 14px; }
        .res-menu-tag { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
        .res-detail { font-size: 13px; color: #64748b; margin-top: 4px; }
    </style>
</head>
<body>
    <header><h1 class="logo-title">Self CHIMR</h1></header>
    <main>
        <div class="tabs-nav">
            <input type="radio" id="tab-reserver" name="main-tabs" class="hidden" checked onchange="switchTab('reserver')">
            <label for="tab-reserver">🍴 Réserver</label>
            <input type="radio" id="tab-mes-res" name="main-tabs" class="hidden" onchange="switchTab('mes-res')">
            <label for="tab-mes-res">📅 Mes réservations</label>
        </div>

        <div id="section-reserver">
            <h2>📅 Prochains jours</h2>
            <div id="liste-jours" class="grid-jours"></div>
            <form id="form-commande" class="hidden space-form">
                <input type="radio" id="menuA" name="choix_menu" value="Menu A" class="card-menu-input hidden" required>
                <label for="menuA" class="card-menu a"><div class="content"><span class="type-a">Menu A</span><span id="label-menu-a" class="plat-nom"></span></div></label>
                <input type="radio" id="menuB" name="choix_menu" value="Menu B" class="card-menu-input hidden">
                <label for="menuB" class="card-menu b"><div class="content"><span class="type-b">Menu B</span><span id="label-menu-b" class="plat-nom"></span></div></label>
                
                <div class="segmented">
                    <input type="radio" id="retrait-place" name="mode_retrait" value="Sur place" class="hidden" checked>
                    <label for="retrait-place">🍽️ Sur place</label>
                    <input type="radio" id="retrait-emporter" name="mode_retrait" value="À emporter" class="hidden">
                    <label for="retrait-emporter">🛍️ À emporter</label>
                </div>
                
                <div class="bloc-info">
                    <div class="input-group"><label>Nom</label><input type="text" id="nom_client" required></div>
                    <div class="input-group"><label>Heure</label><select id="heure_retrait"><option>12:00</option><option>12:15</option><option>12:30</option><option>12:45</option></select></div>
                </div>
                <button type="submit" id="btn-submit" class="btn-submit">CONFIRMER</button>
            </form>
        </div>

        <div id="section-mes-res" class="hidden">
            <div id="liste-mes-res"></div>
        </div>
    </main>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzcCFLxV_IxqN6zToLlGcCysRZKlbZWFYv2vla3vx8nSV2-BTzdubh9GLmIJ9XMVhjD/exec";
        let menusServeur = {};
        let dateSelectionnee = "";

        function switchTab(tab) {
            document.getElementById('section-reserver').classList.toggle('hidden', tab !== 'reserver');
            document.getElementById('section-mes-res').classList.toggle('hidden', tab !== 'mes-res');
            if(tab === 'mes-res') chargerMesReservations();
        }

        async function chargerMenus() {
            const res = await fetch(URL_SCRIPT + "?action=obtenirMenus");
            menusServeur = await res.json();
            const conteneur = document.getElementById('liste-jours');
            const mtn = new Date();
            for(let i=0; i<5; i++) {
                let d = new Date(mtn.getFullYear(), mtn.getMonth(), mtn.getDate()+i);
                let cle = d.toISOString().split('T')[0];
                if(d.getDay()===0 || d.getDay()===6) continue;
                const btn = document.createElement('div');
                btn.className = 'btn-jour';
                btn.innerHTML = `<span class="j-nom">Lun</span><span class="j-num">${d.getDate()}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.btn-jour').forEach(b => b.classList.remove('actif'));
                    btn.classList.add('actif');
                    dateSelectionnee = cle;
                    document.getElementById('label-menu-a').textContent = menusServeur[cle]?.A || "Menu non défini";
                    document.getElementById('label-menu-b').textContent = menusServeur[cle]?.B || "Menu non défini";
                    document.getElementById('form-commande').classList.remove('hidden');
                };
                conteneur.appendChild(btn);
            }
        }

        function chargerMesReservations() {
            const nom = document.getElementById('nom_client').value.trim();
            const conteneur = document.getElementById('liste-mes-res');
            const mtn = new Date();
            
            fetch(URL_SCRIPT + "?action=obtenirInscriptions").then(res => res.json()).then(data => {
                const mesRes = data.filter(r => r.nom.toLowerCase() === nom.toLowerCase()).filter(r => {
                    const d = new Date(r.date + "T12:00:00");
                    return d >= new Date(mtn.toDateString()) && !(d.toDateString() === mtn.toDateString() && mtn.getHours() >= 14);
                });
                
                conteneur.innerHTML = mesRes.length ? "" : "<p style='text-align:center; margin-top:20px;'>Aucune réservation.</p>";
                mesRes.forEach(r => {
                    const menuNom = (r.menu === "Menu A" ? menusServeur[r.date]?.A : menusServeur[r.date]?.B) || r.menu;
                    const tropTard = new Date(r.date + "T12:00:00").toDateString() === mtn.toDateString() && mtn.getHours() >= 11;
                    const div = document.createElement('div');
                    div.className = 'res-card';
                    div.innerHTML = `<div class="res-header"><span>${r.date}</span><span class="res-menu-tag">${r.menu}</span></div>
                                     <div style="font-weight:700">${menuNom}</div><div class="res-detail">${r.mode} - ${r.heure}</div>
                                     ${!tropTard ? `<button onclick="annuler('${r.nom}','${r.date}')" style="margin-top:10px; background:#ef4444; color:white; border:none; padding:8px; border-radius:8px; width:100%">Annuler</button>` : ''}`;
                    conteneur.appendChild(div);
                });
            });
        }

        function annuler(nom, date) {
            if(!confirm("Annuler ?")) return;
            fetch(URL_SCRIPT, {method:"POST", mode:"no-cors", body:new URLSearchParams({action:"annulerInscription", nom, date})}).then(() => chargerMesReservations());
        }

        document.getElementById('form-commande').onsubmit = (e) => {
            e.preventDefault();
            const nom = document.getElementById('nom_client').value.trim();
            localStorage.setItem('nomUserSelf', nom);
            fetch(URL_SCRIPT, {method:"POST", mode:"no-cors", body:new URLSearchParams({
                action:"enregistrerCommande", date:dateSelectionnee, nom, 
                menu:document.querySelector('input[name="choix_menu"]:checked').value,
                mode:document.querySelector('input[name="mode_retrait"]:checked').value,
                heure:document.getElementById('heure_retrait').value
            })}).then(() => { alert("Enregistré !"); location.reload(); });
        }

        window.onload = chargerMenus;
    </script>
</body>
</html>
