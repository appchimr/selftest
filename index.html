<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self CHIMR • Inscriptions</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f8fafc; color: #0f172a; padding-bottom: 40px; }
        header { background: white; padding: 16px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .logo-title { font-size: 20px; font-weight: 800; color: #0f172a; }
        main { max-width: 450px; margin: 0 auto; padding: 16px; }
        h2 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 12px; padding-left: 4px; }
        
        .grid-jours { display: flex; justify-content: space-between; gap: 6px; width: 100%; }
        .btn-jour { flex: 1; height: 85px; background: white; border: 1px solid #e2e8f0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; min-width: 0; }
        .btn-jour .j-nom { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
        .btn-jour .j-num { font-size: 20px; font-weight: 800; color: #0f172a; margin-top: 2px; }
        .btn-jour .j-mois { font-size: 9px; font-weight: 600; color: #94a3b8; margin-top: 1px; }
        .btn-jour.bloque { background: #f1f5f9; border-color: #e2e8f0; opacity: 0.6; cursor: not-allowed; }
        .btn-jour.bloque .j-num { color: #94a3b8; }
        .btn-jour.bloque .j-mois { font-size: 8px; color: #ef4444; font-weight: 700; margin-top: 2px; text-transform: uppercase; }
        .btn-jour.actif { background: #0f172a; border-color: #0f172a; }
        .btn-jour.actif .j-nom { color: #cbd5e1; }
        .btn-jour.actif .j-num { color: white; }
        .btn-jour.actif .j-mois { color: #cbd5e1; }
        
        .hidden { display: none !important; }
        .space-form { margin-top: 24px; }
        
        .card-menu { background: white; border: 1px solid #e2e8f0; border-radius: 20px; padding: 18px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .card-menu .content { flex: 1; padding-right: 12px; display: flex; flex-direction: column; align-items: flex-start; }
        .card-menu .type-a { display: inline-block; font-size: 10px; font-weight: 800; color: #b45309; background: #fef3c7; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; text-transform: uppercase; }
        .card-menu .type-b { display: inline-block; font-size: 10px; font-weight: 800; color: #047857; background: #d1fae5; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; text-transform: uppercase; }
        .card-menu .plat-nom { font-size: 15px; font-weight: 700; color: #334155; line-height: 1.4; margin-bottom: 8px; }
        .card-menu .formule-fixe { font-size: 11px; font-style: italic; color: #64748b; font-weight: 500; }
        .card-menu .radio-custom { height: 20px; width: 20px; border: 2px solid #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .card-menu .radio-custom::after { content: ""; width: 8px; height: 8px; background: white; border-radius: 50%; display: none; }
        
        .card-menu-input:checked + .card-menu.a { border-color: #f59e0b; background: rgba(254,243,199,0.15); }
        .card-menu-input:checked + .card-menu.a .radio-custom { border-color: #f59e0b; background: #f59e0b; }
        .card-menu-input:checked + .card-menu.a .radio-custom::after { display: block; }
        .card-menu-input:checked + .card-menu.b { border-color: #10b981; background: rgba(209,250,229,0.15); }
        .card-menu-input:checked + .card-menu.b .radio-custom { border-color: #10b981; background: #10b981; }
        .card-menu-input:checked + .card-menu.b .radio-custom::after { display: block; }
        
        .segmented { display: flex; background: #e2e8f0; padding: 3px; border-radius: 14px; margin-bottom: 20px; }
        .segmented label { flex: 1; text-align: center; padding: 10px; font-size: 13px; font-weight: 700; color: #64748b; border-radius: 11px; cursor: pointer; }
        .segmented input:checked + label { background: white; color: #0f172a; }
        
        .bloc-info { background: white; border: 1px solid #e2e8f0; padding: 16px; border-radius: 20px; margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; font-weight: 600; color: #334155; outline: none; }
        
        .btn-submit { width: 100%; background: #0f172a; color: white; border: none; font-size: 13px; font-weight: 700; text-transform: uppercase; padding: 16px; border-radius: 16px; cursor: pointer; transition: opacity 0.2s; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .chargement { text-align: center; padding: 30px; font-weight: 600; color: #64748b; }
        
        .ecran-confirmation { text-align: center; padding: 40px 20px; }
        .confirmation-cercle { width: 80px; height: 80px; background: #dcfce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 36px; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .confirmation-titre { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
        .confirmation-recap { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin: 20px 0; text-align: left; }
        .confirmation-recap .recap-ligne { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .confirmation-recap .recap-ligne:last-child { border-bottom: none; }
        .confirmation-recap .recap-label { color: #94a3b8; font-weight: 600; }
        .confirmation-recap .recap-valeur { color: #0f172a; font-weight: 700; }
        .btn-nouvelle-resa { width: 100%; background: #0f172a; color: white; border: none; font-size: 13px; font-weight: 700; text-transform: uppercase; padding: 16px; border-radius: 16px; cursor: pointer; margin-top: 8px; }

        .msg-erreur { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 14px; padding: 14px 16px; font-size: 13px; font-weight: 600; margin-top: 12px; display: none; }

        .tabs { display: flex; background: #e2e8f0; padding: 3px; border-radius: 14px; margin-bottom: 20px; }
        .tabs button { flex: 1; background: none; border: none; padding: 10px; font-size: 13px; font-weight: 700; color: #64748b; border-radius: 11px; cursor: pointer; }
        .tabs button.actif { background: white; color: #0f172a; }

        .resa-item { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
        .resa-item .resa-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .resa-item .resa-date { font-size: 12px; font-weight: 800; color: #94a3b8; text-transform: uppercase; }
        .resa-item .badge-menu-a { font-size: 10px; font-weight: 800; color: #b45309; background: #fef3c7; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
        .resa-item .badge-menu-b { font-size: 10px; font-weight: 800; color: #047857; background: #d1fae5; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
        .resa-item .resa-plat { font-size: 15px; font-weight: 700; color: #334155; line-height: 1.4; margin-bottom: 4px; }
        .resa-item .resa-detail { font-size: 12px; color: #64748b; }
        .resa-item .resa-footer { display: flex; justify-content: flex-end; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f1f5f9; }
        .btn-annuler { background: none; border: 1px solid #fecaca; color: #ef4444; font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
        .confirm-annul { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: 12px; color: #dc2626; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .confirm-annul .btn-oui { background: #ef4444; color: white; border: none; font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
        .confirm-annul .btn-non { background: #e2e8f0; color: #475569; border: none; font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
        .resa-vide { text-align: center; padding: 30px 16px; color: #94a3b8; font-size: 14px; font-weight: 600; }

        .banniere-alerte { background: #fff7ed; border: 2px solid #f97316; border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
        .banniere-alerte .alerte-titre { font-size: 14px; font-weight: 800; color: #c2410c; margin-bottom: 4px; }
        .banniere-alerte .alerte-detail { font-size: 12px; color: #9a3412; }
        .resa-item.alerte-menu { border-color: #f97316; border-width: 2px; }
        .alerte-menu-badge { display: flex; align-items: center; gap: 6px; background: #fff7ed; border: 1px solid #fed7aa; color: #c2410c; font-size: 11px; font-weight: 700; padding: 6px 8px; border-radius: 8px; margin-bottom: 8px; }
        .action-requise { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 12px; margin-top: 10px; }
        .action-requise p { font-size: 12px; color: #c2410c; font-weight: 700; margin-bottom: 8px; }
        .action-btns { display: flex; flex-direction: column; gap: 6px; }
        .btn-action { border: none; font-size: 12px; font-weight: 700; padding: 10px 12px; border-radius: 8px; cursor: pointer; text-align: left; width: 100%; }
        .btn-garder { background: #dcfce7; color: #15803d; }
        .btn-changer { background: #dbeafe; color: #1d4ed8; }
        .btn-annuler-menu { background: #fee2e2; color: #dc2626; }
    </style>
</head>
<body>

    <header>
        <div><h1 class="logo-title">Self CHIMR</h1></div>
    </header>

    <main>
        <div id="zone-chargement" class="chargement">🔄 Récupération des menus en cours...</div>
        
        <div id="app-contenu" class="hidden">
            <div class="tabs">
                <button id="tab-reserver" class="actif" onclick="afficherOnglet('reserver')">🍴 Réserver</button>
                <button id="tab-reservations" onclick="afficherOnglet('reservations')">📅 Mes réservations</button>
            </div>

            <div id="zone-alertes"></div>

            <div id="contenu-reserver">
                <div style="margin-bottom: 20px;">
                    <h2>📅 Prochains jours disponibles</h2>
                    <p style="font-size:12px; color:#94a3b8; font-weight:600; margin-bottom:10px; padding-left:4px;">⏰ Réservation possible jusqu'à 10h30 le jour même</p>
                    <div id="liste-jours" class="grid-jours"></div>
                </div>
                
                <form id="form-commande" class="hidden space-form">
                    <div>
                        <h2>1. Sélectionnez votre assiette</h2>
                        <input type="radio" id="menuA" name="choix_menu" value="Menu A" class="card-menu-input hidden" required>
                        <label for="menuA" class="card-menu a">
                            <div class="content">
                                <span class="type-a">🍖 Menu A</span>
                                <span id="label-menu-a" class="plat-nom"></span>
                                <span class="formule-fixe">Entrée + Plat + Fromage + Dessert</span>
                            </div>
                            <div class="radio-custom"></div>
                        </label>
                        
                        <input type="radio" id="menuB" name="choix_menu" value="Menu B" class="card-menu-input hidden">
                        <label for="menuB" class="card-menu b">
                            <div class="content">
                                <span class="type-b">🌿 Menu B</span>
                                <span id="label-menu-b" class="plat-nom"></span>
                                <span class="formule-fixe">Entrée + Plat + Fromage + Dessert</span>
                            </div>
                            <div class="radio-custom"></div>
                        </label>
                    </div>
                    
                    <div style="margin-top: 20px;">
                        <h2>2. Où mangez-vous ?</h2>
                        <div class="segmented">
                            <input type="radio" id="retrait-place" name="mode_retrait" value="Sur place" class="hidden" checked>
                            <label for="retrait-place">🍽️ Sur place</label>
                            <input type="radio" id="retrait-emporter" name="mode_retrait" value="À emporter" class="hidden">
                            <label for="retrait-emporter">🛍️ À emporter</label>
                        </div>
                    </div>
                    
                    <div>
                        <h2>3. Finaliser la réservation</h2>
                        <div class="bloc-info">
                            <div class="input-group">
                                <label>Nom & Prénom</label>
                                <input type="text" id="nom_client" required placeholder="Votre nom complet">
                            </div>
                            <div class="input-group">
                                <label>Heure du retrait</label>
                                <select id="heure_retrait">
                                    <option>12:00</option><option>12:15</option><option>12:30</option><option>12:45</option>
                                    <option>13:00</option><option>13:15</option><option>13:30</option><option>13:45</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <button type="submit" id="btn-submit" class="btn-submit">Confirmer la commande</button>
                    <div id="msg-erreur" class="msg-erreur">⚠️ Erreur de connexion.</div>
                </form>

                <div id="ecran-confirmation" class="ecran-confirmation hidden">
                    <div class="confirmation-cercle">✅</div>
                    <div class="confirmation-titre">Réservation enregistrée !</div>
                    <div class="confirmation-recap" id="recap-commande"></div>
                    <button class="btn-nouvelle-resa" onclick="nouvelleReservation()">Faire une autre réservation</button>
                </div>
            </div>

            <div id="contenu-reservations" class="hidden">
                <div id="liste-reservations"></div>
            </div>
        </div>
    </main>

    <script>
        const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbzcCFLxV_IxqN6zToLlGcCysRZKlbZWFYv2vla3vx8nSV2-BTzdubh9GLmIJ9XMVhjD/exec";
        const JOURS_NOM = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];
        const MOIS_FR = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
        let dateSelectionneeISO = "";
        let menusDuServeur = {};

        function afficherOnglet(onglet) {
            document.getElementById('tab-reserver').classList.toggle('actif', onglet === 'reserver');
            document.getElementById('tab-reservations').classList.toggle('actif', onglet === 'reservations');
            document.getElementById('contenu-reserver').classList.toggle('hidden', onglet !== 'reserver');
            document.getElementById('contenu-reservations').classList.toggle('hidden', onglet !== 'reservations');
            if (onglet === 'reservations') chargerMesReservations();
        }

        function formaterDate(dateStr) {
            const propre = (dateStr || '').toString().replace(/'/g, '').trim();
            const JOURS_LONG = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
            const MOIS_LONG = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
            const parts = propre.split('-');
            if (parts.length !== 3) return propre;
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            return JOURS_LONG[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS_LONG[d.getMonth()];
        }

        function chargerMesReservations() {
            const nom = localStorage.getItem('nomUserSelf') || '';
            const zone = document.getElementById('liste-reservations');
            if (!nom) { zone.innerHTML = '<div class="resa-vide"><span>👤</span>Veuillez inscrire votre nom.</div>'; return; }
            zone.innerHTML = '<div class="resa-vide"><span>🔄</span>Chargement...</div>';

            fetch(URL_SCRIPT_GOOGLE + "?action=obtenirInscriptions")
            .then(res => res.json())
            .then(data => {
                const maintenant = new Date();
                const minutesMaintenant = maintenant.getHours() * 60 + maintenant.getMinutes();
                const auj = `${maintenant.getFullYear()}-${String(maintenant.getMonth()+1).padStart(2,'0')}-${String(maintenant.getDate()).padStart(2,'0')}`;
                
                const mesSesas = data.filter(r => r.nom && r.nom.trim().toLowerCase() === nom.toLowerCase())
                    .filter(r => {
                        const datePropre = (r.date || '').toString().replace(/'/g, '').trim();
                        if (datePropre > auj) return true;
                        if (datePropre === auj) return minutesMaintenant < 14 * 60;
                        return false;
                    }).sort((a, b) => (a.date || '').localeCompare(b.date || ''));

                if (mesSesas.length === 0) { zone.innerHTML = '<div class="resa-vide">Aucune réservation.</div>'; return; }
                zone.innerHTML = '<h2 style="margin-bottom:12px;">Réservations de ' + nom + '</h2>' + mesSesas.map(r => {
                    const isA = r.menu && r.menu.includes('A');
                    const menusJour = menusDuServeur[(r.date || '').replace(/'/g, '').trim()] || {};
                    const aAlerte = isA ? menusJour.alerteA : menusJour.alerteB;
                    
                    return `<div class="resa-item ${aAlerte ? 'alerte-menu' : ''}">
                        <div class="resa-header">
                            <div class="resa-date">${formaterDate(r.date)}</div>
                            <span class="${isA ? 'badge-menu-a' : 'badge-menu-b'}">${isA ? '🍖 Menu A' : '🌿 Menu B'}</span>
                        </div>
                        <div class="resa-plat">${isA ? (menusJour.A || '') : (menusJour.B || '')}</div>
                        <div class="resa-detail">${r.mode} · ${r.heure}</div>
                    </div>`;
                }).join('');
            });
        }

        function verifierAlertesUtilisateur() {
            const nom = localStorage.getItem('nomUserSelf') || '';
            if (!nom) return;
            fetch(URL_SCRIPT_GOOGLE + "?action=obtenirInscriptions")
            .then(res => res.json())
            .then(data => {
                const maintenant = new Date();
                const minutesMaintenant = maintenant.getHours() * 60 + maintenant.getMinutes();
                const auj = `${maintenant.getFullYear()}-${String(maintenant.getMonth()+1).padStart(2,'0')}-${String(maintenant.getDate()).padStart(2,'0')}`;
                
                const alertes = data.filter(r => r.nom && r.nom.trim().toLowerCase() === nom.toLowerCase())
                    .filter(r => {
                        const dp = (r.date || '').toString().replace(/'/g, '').trim();
                        return dp > auj || (dp === auj && minutesMaintenant < 14 * 60);
                    })
                    .filter(r => {
                        const dp = (r.date || '').toString().replace(/'/g, '').trim();
                        const menusJour = menusDuServeur[dp] || {};
                        return r.menu.includes('A') ? menusJour.alerteA : menusJour.alerteB;
                    });
                
                const zone = document.getElementById('zone-alertes');
                zone.innerHTML = alertes.map(r => `
                    <div class="banniere-alerte">
                        <div class="alerte-titre">⚠️ Menu modifié le ${formaterDate(r.date)}</div>
                        <div class="alerte-detail">Votre ${r.menu} a été modifié. <strong style="cursor:pointer;text-decoration:underline;" onclick="afficherOnglet('reservations')">Consultez "Mes réservations"</strong>.</div>
                    </div>`).join('');
            });
        }

        function chargerMenus() {
            fetch(URL_SCRIPT_GOOGLE + "?action=obtenirMenus")
            .then(res => res.json())
            .then(donnees => {
                menusDuServeur = donnees;
                document.getElementById('zone-chargement').classList.add('hidden');
                document.getElementById('app-contenu').classList.remove('hidden');
                genererCalendrier();
                verifierAlertesUtilisateur(); // Appel ajouté ici
            });
        }

        function genererCalendrier() {
            const conteneur = document.getElementById('liste-jours');
            conteneur.innerHTML = "";
            const maintenant = new Date();
            let affiches = 0;
            for (let i = 0; i < 15; i++) {
                if (affiches >= 5) break;
                let d = new Date(maintenant.getFullYear(), maintenant.getMonth(), maintenant.getDate() + i);
                if (d.getDay() === 0 || d.getDay() === 6) continue;
                if (i === 0 && (maintenant.getHours() > 10 || (maintenant.getHours() === 10 && maintenant.getMinutes() >= 30))) continue;
                
                let cle = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                let menus = menusDuServeur[cle] || { A: "", B: "" };
                if (!menus.A && !menus.B) continue;
                
                const btn = document.createElement('div');
                btn.className = 'btn-jour';
                btn.innerHTML = `<span class="j-nom">${JOURS_NOM[d.getDay()]}</span><span class="j-num">${d.getDate()}</span><span class="j-mois">${MOIS_FR[d.getMonth()]}</span>`;
                btn.onclick = function() {
                    document.querySelectorAll('.btn-jour').forEach(b => b.classList.remove('actif'));
                    btn.classList.add('actif');
                    dateSelectionneeISO = cle;
                    document.getElementById('label-menu-a').textContent = menus.A || "Non défini";
                    document.getElementById('label-menu-b').textContent = menus.B || "Non défini";
                    document.getElementById('form-commande').classList.remove('hidden');
                };
                conteneur.appendChild(btn);
                affiches++;
            }
        }

        document.getElementById('form-commande').addEventListener('submit', function(e) {
            e.preventDefault();
            const nomSaisi = document.getElementById('nom_client').value.trim();
            localStorage.setItem('nomUserSelf', nomSaisi);
            const donnees = {
                action: "enregistrerCommande",
                date: dateSelectionneeISO,
                nom: nomSaisi,
                menu: document.querySelector('input[name="choix_menu"]:checked').value,
                mode: document.querySelector('input[name="mode_retrait"]:checked').value,
                heure: document.getElementById('heure_retrait').value
            };
            fetch(URL_SCRIPT_GOOGLE, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(donnees) })
            .then(() => {
                document.getElementById('form-commande').classList.add('hidden');
                document.getElementById('ecran-confirmation').classList.remove('hidden');
                document.getElementById('recap-commande').innerHTML = `...`;
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            chargerMenus();
