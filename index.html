<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self CHIMR • Inscriptions</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; padding-bottom: 40px; }
        header { background: white; padding: 16px 20px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 50; }
        .logo-title { font-size: 20px; font-weight: 800; }
        main { max-width: 450px; margin: 0 auto; padding: 16px; }
        h2 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 12px; }
        
        .grid-jours { display: flex; justify-content: space-between; gap: 6px; }
        .btn-jour { flex: 1; height: 85px; background: white; border: 1px solid #e2e8f0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .btn-jour.actif { background: #0f172a; color: white; }
        
        .card-menu { background: white; border: 1px solid #e2e8f0; border-radius: 20px; padding: 18px; margin-bottom: 12px; cursor: pointer; }
        .card-menu-input:checked + .card-menu { border-color: #0f172a; background: #f8fafc; }
        
        .btn-submit { width: 100%; background: #0f172a; color: white; border: none; padding: 16px; border-radius: 16px; font-weight: 700; cursor: pointer; }
        .verif-box { background: white; border: 2px solid #e2e8f0; padding: 16px; border-radius: 20px; margin-bottom: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header><h1 class="logo-title">Self CHIMR</h1></header>
    <main>
        <div id="zone-chargement">🔄 Chargement...</div>
        <div id="app-contenu" class="hidden">
            <div class="verif-box">
                <h2>🔍 Vérifier mes inscriptions</h2>
                <input type="text" id="nom_recherche" placeholder="Votre nom..." style="width:100%; padding:8px; margin-bottom:8px;">
                <button type="button" class="btn-submit" style="background:#64748b;" onclick="verifierMesReservations()">Voir mes réservations</button>
                <div id="resultat-recherche" style="margin-top: 10px; font-size: 13px;"></div>
            </div>

            <div id="liste-jours" class="grid-jours"></div>
            
            <form id="form-commande" class="hidden">
                <input type="radio" id="menuA" name="choix_menu" value="Menu A" class="card-menu-input hidden" required>
                <label for="menuA" class="card-menu">Menu A</label>
                
                <input type="radio" id="menuB" name="choix_menu" value="Menu B" class="card-menu-input hidden">
                <label for="menuB" class="card-menu">Menu B</label>
                
                <input type="text" id="nom_client" placeholder="Votre nom" required style="width:100%; padding:12px; margin-bottom:12px;">
                <button type="submit" id="btn-submit" class="btn-submit">Confirmer</button>
            </form>
        </div>
    </main>

    <script>
        const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbzcCFLxV_IxqN6zToLlGcCysRZKlbZWFYv2vla3vx8nSV2-BTzdubh9GLmIJ9XMVhjD/exec";
        
        function chargerMenus() {
            fetch(URL_SCRIPT_GOOGLE + "?action=obtenirMenus")
            .then(res => res.json())
            .then(data => {
                document.getElementById('zone-chargement').classList.add('hidden');
                document.getElementById('app-contenu').classList.remove('hidden');
            })
            .catch(() => { document.getElementById('zone-chargement').textContent = "❌ Erreur de catalogue"; });
        }

        function verifierMesReservations() {
            const nom = document.getElementById('nom_recherche').value.trim();
            if (!nom) { alert("Saisissez votre nom."); return; }
            fetch(URL_SCRIPT_GOOGLE + "?action=obtenirInscriptions")
            .then(res => res.json())
            .then(data => {
                const mesResa = data.filter(r => r.nom.toLowerCase() === nom.toLowerCase());
                document.getElementById('resultat-recherche').innerHTML = mesResa.length > 0 
                    ? mesResa.map(r => `✅ ${r.date} : ${r.menu}`).join('<br>') 
                    : "Aucune réservation trouvée.";
            });
        }

        document.getElementById('form-commande').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch(URL_SCRIPT_GOOGLE, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                    action: "enregistrerCommande",
                    date: "2026-06-07",
                    nom: document.getElementById('nom_client').value,
                    menu: document.querySelector('input[name="choix_menu"]:checked').value,
                    mode: "Sur place",
                    heure: "12:00"
                })
            }).then(() => alert("🎉 Réservation enregistrée !"));
        });

        chargerMenus();
    </script>
</body>
</html>
