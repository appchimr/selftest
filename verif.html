<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Réservations • Self CHIMR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; padding: 20px; color: #0f172a; }
        main { max-width: 450px; margin: 0 auto; background: white; padding: 24px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; }
        .btn { width: 100%; padding: 14px; background: #0f172a; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .resa-card { border: 1px solid #e2e8f0; padding: 15px; margin-top: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .btn-cancel { background: #ef4444; color: white; padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>🔍 Mes Réservations</h1>
        <input type="text" id="nom_client" placeholder="Entrez votre nom complet...">
        <button class="btn" onclick="chercher()">Voir mes réservations</button>
        <div id="liste-resultats" style="margin-top: 20px;"></div>
    </main>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzcCFLxV_IxqN6zToLlGcCysRZKlbZWFYv2vla3vx8nSV2-BTzdubh9GLmIJ9XMVhjD/exec";

        function chercher() {
            const nom = document.getElementById('nom_client').value.trim();
            if (!nom) return alert("Veuillez entrer un nom.");

            fetch(URL_SCRIPT + "?action=obtenirInscriptions")
            .then(res => res.json())
            .then(data => {
                const mesResas = data.filter(r => r.nom.toLowerCase() === nom.toLowerCase());
                const conteneur = document.getElementById('liste-resultats');
                conteneur.innerHTML = mesResas.length ? "" : "Aucune réservation trouvée pour ce nom.";
                
                mesResas.forEach(r => {
                    // Correction ici pour éviter le décalage de date : 
                    // On découpe la chaine "YYYY-MM-DD" manuellement
                    const parts = r.date.split('-');
                    const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
                    
                    const dateLisible = dateObj.toLocaleDateString('fr-FR', { 
                        weekday: 'long', 
                        day: 'numeric', 
                        month: 'long' 
                    });

                    const div = document.createElement('div');
                    div.className = 'resa-card';
                    div.innerHTML = `
                        <div style="font-size: 14px;">
                            <strong>${dateLisible.charAt(0).toUpperCase() + dateLisible.slice(1)}</strong><br>
                            <span style="color: #64748b; font-size: 12px;">${r.menu} - ${r.mode} (${r.heure})</span>
                        </div>
                        <button class="btn-cancel" onclick="annuler('${r.nom}', '${r.date}')">Annuler</button>
                    `;
                    conteneur.appendChild(div);
                });
            });
        }

        function annuler(nom, date) {
            if(!confirm("Êtes-vous sûr de vouloir annuler cette réservation ?")) return;
            
            fetch(URL_SCRIPT, {
                method: "POST",
                mode: "no-cors",
                body: new URLSearchParams({ action: "annulerInscription", nom: nom, date: date })
            }).then(() => { 
                alert("Réservation annulée."); 
                chercher(); 
            });
        }
    </script>
</body>
</html>
